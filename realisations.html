<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réalisations — Brandini</title>
  <meta name="description" content="Identités visuelles, sites web et contenus réalisés par Brandini.">
  <link rel="canonical" href="https://brandini.pro/realisations.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f6f4ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body data-page="work"
      data-title-fr="Réalisations — Brandini" data-title-en="Work — Brandini"
      data-desc-fr="Identités visuelles, sites web et contenus réalisés par Brandini."
      data-desc-en="Visual identities, websites and content created by Brandini.">

<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow reveal" data-i18n="work.eyebrow"></span>
      <h1 class="display reveal d1" data-i18n="work.title"></h1>
      <p class="lead reveal d2" data-i18n="work.lead"></p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="container">
      <div class="filters reveal">
        <button type="button" class="filter on" data-filter="all" data-i18n="filter.all"></button>
        <button type="button" class="filter" data-filter="identity" data-i18n="filter.identity"></button>
        <button type="button" class="filter" data-filter="web" data-i18n="filter.web"></button>
        <button type="button" class="filter" data-filter="content" data-i18n="filter.content"></button>
      </div>

      <!-- Pour ajouter un vrai projet : remplace le contenu de .work-visual par
           <img src="assets/img/mon-projet.jpg" alt="..."> et retire le badge "Concept". -->
      <div class="work-grid">
        <div class="work-card reveal" data-cat="identity">
          <div class="work-visual v1"><span class="badge" data-i18n="common.concept"></span><span class="mark">Verdane</span></div>
          <div class="work-meta"><h3>Verdane</h3><span data-i18n="p1.cat"></span></div>
        </div>
        <div class="work-card reveal d1" data-cat="identity web">
          <div class="work-visual v2"><span class="badge" data-i18n="common.concept"></span><span class="mark"><em>Solène</em></span></div>
          <div class="work-meta"><h3>Solène</h3><span data-i18n="p2.cat"></span></div>
        </div>
        <div class="work-card reveal" data-cat="identity">
          <div class="work-visual v3"><span class="badge" data-i18n="common.concept"></span><span class="mark">Maison&nbsp;Ocre</span></div>
          <div class="work-meta"><h3>Maison Ocre</h3><span data-i18n="p3.cat"></span></div>
        </div>
        <div class="work-card reveal d1" data-cat="web">
          <div class="work-visual v4"><span class="badge" data-i18n="common.concept"></span><span class="mark"><em>Nuit</em>.</span></div>
          <div class="work-meta"><h3>Nuit Studio</h3><span data-i18n="p4.cat"></span></div>
        </div>
        <div class="work-card reveal" data-cat="content">
          <div class="work-visual v5"><span class="badge" data-i18n="common.concept"></span><span class="mark">Pépite</span></div>
          <div class="work-meta"><h3>Pépite</h3><span data-i18n="p5.cat"></span></div>
        </div>
        <div class="work-card reveal d1" data-cat="content">
          <div class="work-visual v6"><span class="badge" data-i18n="common.concept"></span><span class="mark">KRŌM</span></div>
          <div class="work-meta"><h3>Krōm</h3><span data-i18n="p6.cat"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="container">
      <h2 class="display reveal" data-i18n="cta.title"></h2>
      <p class="reveal d1" data-i18n="cta.text"></p>
      <a href="contact.html" class="btn btn-primary reveal d2"><span data-i18n="cta.btn"></span> <span class="arrow">→</span></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/main.js?v=2"></script>
</body>
</html>
