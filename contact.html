<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Brandini</title>
  <meta name="description" content="Parlez-nous de votre projet de marque, d'identité visuelle ou de site web.">
  <link rel="canonical" href="https://brandini.pro/contact.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f6f4ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body data-page="contact"
      data-title-fr="Contact — Brandini" data-title-en="Contact — Brandini"
      data-desc-fr="Parlez-nous de votre projet de marque, d'identité visuelle ou de site web."
      data-desc-en="Tell us about your brand, visual identity or website project.">

<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow reveal" data-i18n="contact.eyebrow"></span>
      <h1 class="display reveal d1" data-i18n="contact.title"></h1>
      <p class="lead reveal d2" data-i18n="contact.lead"></p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="container contact-grid">
      <div class="contact-info reveal">
        <span class="eyebrow" data-i18n="wa.title"></span>
        <div class="wa-cards" data-wa-cards></div>
        <dl style="margin-top:20px">
          <dt data-i18n="contact.email"></dt>
          <dd><a href="mailto:contact@brandini.pro">contact@brandini.pro</a></dd>
          <dt data-i18n="contact.zone"></dt>
          <dd data-i18n="contact.zone.value"></dd>
          <dt data-i18n="contact.social"></dt>
          <dd><a href="https://instagram.com/brandini.pro" target="_blank" rel="noopener">Instagram</a> · <a href="https://linkedin.com/company/brandini" target="_blank" rel="noopener">LinkedIn</a></dd>
        </dl>
      </div>

      <form id="contact-form" class="form reveal d1" method="post">
        <div class="row">
          <div class="field"><label for="f-name" data-i18n="form.name"></label><input id="f-name" name="name" type="text" required autocomplete="name"></div>
          <div class="field"><label for="f-email" data-i18n="form.email"></label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
        </div>
        <div class="row">
          <div class="field"><label for="f-company" data-i18n="form.company"></label><input id="f-company" name="company" type="text" autocomplete="organization"></div>
          <div class="field">
            <label for="f-budget" data-i18n="form.budget"></label>
            <select id="f-budget" name="budget">
              <option value="" data-i18n="form.budget.choose"></option>
              <option value="< 2k" data-i18n="form.budget.1"></option>
              <option value="2k-5k" data-i18n="form.budget.2"></option>
              <option value="5k-15k" data-i18n="form.budget.3"></option>
              <option value="> 15k" data-i18n="form.budget.4"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <label data-i18n="form.needs"></label>
          <div class="chips">
            <input type="checkbox" id="n1" name="needs[]" value="Stratégie"><label for="n1" data-i18n="svc.strategy"></label>
            <input type="checkbox" id="n2" name="needs[]" value="Identité"><label for="n2" data-i18n="svc.identity"></label>
            <input type="checkbox" id="n3" name="needs[]" value="Naming"><label for="n3" data-i18n="svc.naming"></label>
            <input type="checkbox" id="n4" name="needs[]" value="Site web"><label for="n4" data-i18n="svc.web"></label>
            <input type="checkbox" id="n5" name="needs[]" value="Contenu"><label for="n5" data-i18n="svc.content"></label>
            <input type="checkbox" id="n6" name="needs[]" value="Campagne"><label for="n6" data-i18n="svc.campaigns"></label>
          </div>
        </div>
        <div class="field">
          <label for="f-msg" data-i18n="form.message"></label>
          <textarea id="f-msg" name="message" required data-i18n-ph="form.message.ph"></textarea>
        </div>
        <!-- anti-spam : champ invisible, doit rester vide -->
        <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
        <div>
          <button type="submit" class="btn btn-primary"><span data-i18n="form.send">Envoyer</span> <span class="arrow">→</span></button>
        </div>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/main.js?v=2"></script>
</body>
</html>
