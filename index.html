<body data-page="home"
      data-title-fr="Brandini — Agence de branding & marketing"
      data-title-en="Brandini — Branding & marketing agency"

      data-desc-en="Brandini, branding and marketing agency: brand strategy, visual identity, websites and content.">

<header id="site-header"></header>

<main>
  <section class="hero">
    <div class="container">
      <span class="eyebrow reveal" data-i18n="home.eyebrow">Agence de branding & marketing</span>
      <h1 class="display reveal d1" data-i18n="home.title">On crée des marques qu'on <em>n'oublie</em> pas.</h1>
      <div class="hero-bottom">
        <p class="lead reveal d2" data-i18n="home.lead"></p>
        <div class="hero-actions reveal d3">
          <a href="/contact" class="btn btn-primary"><span data-i18n="home.cta1">Démarrer un projet</span> <span class="arrow">→</span></a>
          <a href="/realisations" class="btn btn-ghost" data-i18n="home.cta2">Voir nos réalisations</a>
        </div>
      </div>
    </div>
  </section>

  <section class="home-stats">
    <div class="container">
      <div class="stats">
        <div class="stat reveal"><strong><span data-count="11">11</span> <small data-i18n="stats.years.unit"></small></strong><span data-i18n="stats.years"></span></div>
        <div class="stat reveal d1"><strong><span data-count="17">17</span></strong><span data-i18n="stats.clients"></span></div>
        <div class="stat reveal d2"><strong><span data-count="650">650</span>&nbsp;k€</strong><span data-i18n="stats.budget"></span></div>
        <div class="stat reveal d3"><strong><span data-count="12">12</span>&nbsp;M</strong><span data-i18n="stats.views"></span></div>
      </div>
      <div class="sectors reveal">
        <span class="sectors-label" data-i18n="sectors.label"></span>
        <ul>
          <li data-i18n="sector.realestate"></li>
          <li data-i18n="sector.ecommerce"></li>
          <li data-i18n="sector.fashion"></li>
          <li data-i18n="sector.fnb"></li>
          <li data-i18n="sector.setup"></li>
        </ul>
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true">
    <div class="marquee-track">
      <span data-i18n="svc.strategy"></span><span data-i18n="svc.identity"></span><span data-i18n="svc.naming"></span><span data-i18n="svc.web"></span><span data-i18n="svc.content"></span><span data-i18n="svc.campaigns"></span>
      <span data-i18n="svc.strategy"></span><span data-i18n="svc.identity"></span><span data-i18n="svc.naming"></span><span data-i18n="svc.web"></span><span data-i18n="svc.content"></span><span data-i18n="svc.campaigns"></span>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow reveal" data-i18n="home.svc.eyebrow"></span>
          <h2 class="h2 reveal d1" data-i18n="home.svc.title"></h2>
        </div>
        <p class="lead reveal d2" data-i18n="home.svc.lead"></p>
      </div>
      <div class="services-list">
        <a href="/services" class="service-row reveal"><span class="service-num">01</span><h3 class="h3" data-i18n="svc.strategy"></h3><p data-i18n="home.svc1.text"></p><span class="plus">+</span></a>
        <a href="/services" class="service-row reveal"><span class="service-num">02</span><h3 class="h3" data-i18n="svc.identity"></h3><p data-i18n="home.svc2.text"></p><span class="plus">+</span></a>
        <a href="/services" class="service-row reveal"><span class="service-num">03</span><h3 class="h3" data-i18n="svc.web"></h3><p data-i18n="home.svc3.text"></p><span class="plus">+</span></a>
        <a href="/services" class="service-row reveal"><span class="service-num">04</span><h3 class="h3" data-i18n="svc.content"></h3><p data-i18n="home.svc4.text"></p><span class="plus">+</span></a>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow reveal" data-i18n="home.work.eyebrow"></span>
          <h2 class="h2 reveal d1" data-i18n="home.work.title"></h2>
        </div>
        <div class="reveal d2">
          <p class="lead" data-i18n="home.work.lead"></p>
          <p style="margin-top:24px"><a href="/realisations" class="btn btn-ghost btn-sm"><span data-i18n="common.allWork"></span> <span class="arrow">→</span></a></p>
        </div>
      </div>
      <div class="work-grid">
        <a href="/realisations" class="work-card reveal">
          <div class="work-visual v1"><span class="badge" data-i18n="common.concept"></span><span class="mark">Verdane</span></div>
          <div class="work-meta"><h3>Verdane</h3><span data-i18n="p1.cat"></span></div>
        </a>
        <a href="/realisations" class="work-card reveal d1">
          <div class="work-visual v2"><span class="badge" data-i18n="common.concept"></span><span class="mark"><em>Solène</em></span></div>
          <div class="work-meta"><h3>Solène</h3><span data-i18n="p2.cat"></span></div>
        </a>
      </div>
    </div>
  </section>

  <section class="quote">
    <div class="container">
      <blockquote class="reveal" data-i18n="home.manifesto"></blockquote>
      <cite class="reveal d1" data-i18n="home.manifesto.cite"></cite>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow reveal" data-i18n="home.process.eyebrow"></span>
          <h2 class="h2 reveal d1" data-i18n="home.process.title"></h2>
        </div>
      </div>
      <div class="process">
        <div class="step reveal"><span class="n">01</span><h3 data-i18n="step1.title"></h3><p data-i18n="step1.text"></p></div>
        <div class="step reveal d1"><span class="n">02</span><h3 data-i18n="step2.title"></h3><p data-i18n="step2.text"></p></div>
        <div class="step reveal d2"><span class="n">03</span><h3 data-i18n="step3.title"></h3><p data-i18n="step3.text"></p></div>
        <div class="step reveal d3"><span class="n">04</span><h3 data-i18n="step4.title"></h3><p data-i18n="step4.text"></p></div>
      </div>
    </div>
  </section>

  <section class="founders-section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow reveal" data-i18n="founders.eyebrow"></span>
          <h2 class="h2 reveal d1" data-i18n="founders.title"></h2>
        </div>
      </div>
      <div class="founders">
        <figure class="founder reveal">
          <blockquote data-i18n="founders.ghita.quote"></blockquote>
          <figcaption><img src="assets/img/team-ghita-sm.jpg" alt="" width="56" height="56"><span><strong>Ghita</strong><span data-i18n="team.ghita.role"></span></span></figcaption>
        </figure>
        <figure class="founder dark reveal d1">
          <blockquote data-i18n="founders.zak.quote"></blockquote>
          <figcaption><img src="assets/img/team-zak-sm.jpg" alt="" width="56" height="56"><span><strong>Zak</strong><span data-i18n="team.zak.role"></span></span></figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="commitments-section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow reveal" data-i18n="commit.eyebrow"></span>
          <h2 class="h2 reveal d1" data-i18n="commit.title"></h2>
        </div>
      </div>
      <div class="commitments">
        <div class="commitment reveal"><span class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h3 data-i18n="commit.1.t"></h3><p data-i18n="commit.1.d"></p></div>
        <div class="commitment reveal d1"><span class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/></svg></span><h3 data-i18n="commit.2.t"></h3><p data-i18n="commit.2.d"></p></div>
        <div class="commitment reveal d2"><span class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3h16v-3"/></svg></span><h3 data-i18n="commit.3.t"></h3><p data-i18n="commit.3.d"></p></div>
        <div class="commitment reveal d3"><span class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span><h3 data-i18n="commit.4.t"></h3><p data-i18n="commit.4.d"></p></div>
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="container">
      <h2 class="display reveal" data-i18n="cta.title"></h2>
      <p class="reveal d1" data-i18n="cta.text"></p>
      <a href="/contact" class="btn btn-primary reveal d2"><span data-i18n="cta.btn"></span> <span class="arrow">→</span></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
